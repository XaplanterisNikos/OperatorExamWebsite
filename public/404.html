<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Η σελίδα δεν βρέθηκε – Operator Exam Quiz</title>

    <!-- Error pages must never appear in Google results -->
    <meta name="robots" content="noindex" />

    <!-- Root-relative paths: Firebase serves this file for ANY missing URL, e.g. /a/b/c,
         so relative paths like "style.css" would break on nested URLs -->
    <link rel="icon" type="image/png" href="/images/icon.png" />
    <link rel="stylesheet" href="/style.css?v=3" />
  </head>

  <body>
    <main class="not-found">
      <div class="container narrow">
        <img
          src="/images/icon.png"
          alt="Εικονίδιο της εφαρμογής Operator Exam Quiz"
          class="app-icon"
          width="512"
          height="512"
        />

        <h1>Η σελίδα δεν βρέθηκε</h1>

        <!-- Explain what happened and give a clear way forward -->
        <p>
          Η διεύθυνση που άνοιξες δεν υπάρχει. Έλεγξε τον σύνδεσμο ή γύρνα
          στην αρχική σελίδα.
        </p>

        <a href="/" class="play-button">Αρχική σελίδα</a>

        <!-- Separate utm_medium so installs coming from broken links are visible in Play Console -->
        <a
          href="https://play.google.com/store/apps/details?id=com.foxnks.xeiristisexamquiz&amp;referrer=utm_source%3Dwebsite%26utm_medium%3D404_page"
          target="_blank"
          rel="noopener"
          class="secondary-link"
        >
          Λήψη από Google Play
        </a>
      </div>
    </main>
  </body>
</html>
